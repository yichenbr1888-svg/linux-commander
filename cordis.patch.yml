# Linux 指令器 — host row (publish-safe: no secrets or vendor values here).
# Configure the AI backend per machine via EITHER environment variables:
#   DSH_LINUX_COMMANDER_API_KEY   (required for AI fallback)
#   DSH_LINUX_COMMANDER_ENDPOINT  (OpenAI-compatible chat completions URL)
#   DSH_LINUX_COMMANDER_MODEL     (model id)
# or a profile-level cordis.patch.yml override of this row's config:
#   config: { apiKey: '...', endpoint: '...', model: '...' }
- insert:
    - id: linux-commander
      name: 'dsh-linux-commander'
      config:
        timeoutMs: 45000